workflows:
  ios-unsigned:
    name: iOS unsigned IPA
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: "SimpleChat.xcodeproj"
        XCODE_SCHEME: "SimpleChat"
    scripts:
      - name: Generate Xcode project
        script: |
          brew install xcodegen
          xcodegen generate

      - name: Run unit tests
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build test CODE_SIGNING_ALLOWED=NO -quiet

      - name: Build unsigned device app
        script: |
          xcodebuild -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME" \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath build-device build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" -quiet

      - name: Package IPA
        script: |
          APP=$(find build-device/Build/Products -name "SimpleChat.app" -path "*iphoneos*" | head -1)
          [ -n "$APP" ] || { echo "no device .app found"; exit 1; }
          rm -rf Payload SimpleChatPlus-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SimpleChatPlus-unsigned.ipa Payload
          ls -la SimpleChatPlus-unsigned.ipa

    artifacts:
      - SimpleChatPlus-unsigned.ipa

    publishing:
      email:
        recipients:
          - cantou16@users.noreply.github.com
        notify:
          success: true
          failure: true
