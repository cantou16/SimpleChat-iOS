name: SimpleChat
options:
  bundleIdPrefix: com.simplechat.ios
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: 0.1.2
    CURRENT_PROJECT_VERSION: 3
targets:
  SimpleChat:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: SimpleChat
        CFBundleShortVersionString: "0.1.2"
        CFBundleVersion: "3"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 允许 http:// 自建端点（局域网 LM Studio / Ollama 等），对齐 Android 端自由度
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.simplechat.ios.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: NO
        CODE_SIGNING_ALLOWED: NO
  SimpleChatTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: SimpleChat
schemes:
  SimpleChat:
    build:
      targets:
        SimpleChat: all
        SimpleChatTests: [test]
    test:
      gatherCoverageData: false
      targets:
        - SimpleChatTests
